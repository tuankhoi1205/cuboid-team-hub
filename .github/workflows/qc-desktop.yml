name: Build QC offline apps
on:
  workflow_dispatch:
  push:
    tags: ['qc-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-22.04
            target: linux
            arch: x64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install web build dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install desktop dependencies
        run: pnpm --dir qc-desktop install --frozen-lockfile
      - name: Install Datumaro worker build dependencies
        run: python -m pip install -r qc-desktop/requirements-build.txt
      - name: Check types and offline workflow
        run: |
          npx tsc --noEmit
          node --experimental-transform-types --test tests/qc-offline.test.ts
      - name: Build offline UI and native worker
        run: |
          node qc-desktop/build.mjs
          node qc-desktop/build-worker.mjs
        env:
          QC_PYTHON: python
      - name: Package app
        working-directory: qc-desktop
        run: pnpm exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Native app smoke test
        if: runner.os != 'Linux'
        run: node tests/qc-desktop.smoke.mjs
        env:
          QC_SMOKE_PACKAGED: '1'
      - name: Native app smoke test under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/qc-desktop.smoke.mjs
        env:
          QC_SMOKE_PACKAGED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: Cuboid-QC-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            qc-desktop/release/*.exe
            qc-desktop/release/*.dmg
            qc-desktop/release/*.zip
            qc-desktop/release/*.AppImage
            qc-desktop/release/*.deb
          if-no-files-found: error
